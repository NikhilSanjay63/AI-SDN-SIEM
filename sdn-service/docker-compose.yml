services:

  primary-controller:
    build: .
    container_name: primary-controller
    command: >
      ryu-manager
      --observe-links
      --ofp-tcp-listen-port 6633
      controllers.primary_controller
    volumes:
      - ./controllers:/app/controllers
    environment:
      - PYTHONPATH=/app
    ports:
      - "6633:6633"
    networks:
      - sdn-net
    restart: unless-stopped
    platform: linux/amd64
    depends_on:
      redis-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost',6633)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  security-controller:
    build: .
    container_name: security-controller
    command: >
      ryu-manager
      --observe-links
      --ofp-tcp-listen-port 6634
      controllers.security_controller
    volumes:
      - ./controllers:/app/controllers
    environment:
      - PYTHONPATH=/app
    ports:
      - "6634:6634"
    networks:
      - sdn-net
    depends_on:
      ai-service:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    restart: unless-stopped
    platform: linux/amd64

  # FIX: restored correct indentation — all keys were at top level before,
  # causing docker compose to throw a parse error and refuse to start entirely.
  # FIX: changed volume mount from ./logs to ../logs so SIEM events land at
  # the project root where Fluent Bit expects them, not inside sdn-service/.
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: ai-service:local
    container_name: ai-service
    ports:
      - "5050:5000"
    volumes:
      - ../logs:/var/log
    networks:
      - sdn-net
    depends_on:
      redis-db:
        condition: service_healthy
    restart: unless-stopped
    platform: linux/amd64
    environment:
      - REDIS_HOST=redis-db
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis-db:
    image: redis:alpine
    container_name: redis-db
    ports:
      - "6379:6379"
    networks:
      - sdn-net
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:

networks:
  sdn-net:
    driver: bridge